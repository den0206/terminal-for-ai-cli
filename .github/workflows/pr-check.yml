name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: false

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Comment PR with coverage
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let coverage = 'Coverage report not available';

            try {
              if (fs.existsSync('./coverage/coverage-summary.json')) {
                const coverageData = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
                const total = coverageData.total;

                coverage = `## Test Coverage Report\n\n` +
                  `| Metric | Percentage |\n` +
                  `|--------|------------|\n` +
                  `| Lines | ${total.lines.pct}% |\n` +
                  `| Statements | ${total.statements.pct}% |\n` +
                  `| Functions | ${total.functions.pct}% |\n` +
                  `| Branches | ${total.branches.pct}% |\n`;
              }
            } catch (error) {
              console.log('Could not read coverage data:', error);
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: coverage
            });

      - name: Check bundle size
        run: |
          WEBVIEW_SIZE=$(stat -f%z "media/webview.js" 2>/dev/null || stat -c%s "media/webview.js")
          EXTENSION_SIZE=$(stat -f%z "dist/extension.js" 2>/dev/null || stat -c%s "dist/extension.js")

          echo "📦 Bundle Sizes:"
          echo "- Webview: $(numfmt --to=iec-i --suffix=B $WEBVIEW_SIZE)"
          echo "- Extension: $(numfmt --to=iec-i --suffix=B $EXTENSION_SIZE)"

          # Warn if webview bundle is too large (> 1MB)
          if [ $WEBVIEW_SIZE -gt 1048576 ]; then
            echo "⚠️ Warning: Webview bundle size is larger than 1MB"
          fi

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
        continue-on-error: true
