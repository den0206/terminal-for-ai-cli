name: Export VSIX

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      electronVersion:
        description: 'VS Code/Cursor の Electron バージョン（node-pty rebuild 用）'
        required: true
        default: '37.7.0'

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      # 優先順位: workflow_dispatch inputs > repository variables > fallback
      ELECTRON_VERSION: ${{ inputs.electronVersion || vars.VSCODE_ELECTRON_VERSION || '39.2.7' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild node-pty for VS Code Electron runtime
        run: npm run rebuild:pty -- --electron "${ELECTRON_VERSION}"

      - name: Build extension
        run: npm run compile

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-for-ai-cli-${{ github.run_number }}
          path: vsix/*.vsix
          if-no-files-found: error
