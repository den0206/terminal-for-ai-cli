name: Test

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript compilation
        run: npm run compile

      - name: Run tests
        run: npm test


  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run compile

      - name: Check for build artifacts
        run: |
          if [ ! -f "dist/extension.js" ]; then
            echo "Error: dist/extension.js not found"
            exit 1
          fi
          if [ ! -f "media/webview.js" ]; then
            echo "Error: media/webview.js not found"
            exit 1
          fi
          echo "Build artifacts verified successfully"
