name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    name: TypeCheck, Test & Build
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['20.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run TypeScript compilation
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Check build artifacts
        run: |
          if [ ! -f "dist/extension.js" ]; then
            echo "Error: dist/extension.js not found"
            exit 1
          fi
          if [ ! -f "media/webview.js" ]; then
            echo "Error: media/webview.js not found"
            exit 1
          fi
          echo "Build artifacts verified successfully"
        shell: bash

  # Export VSIX の "Sync version and README to main" が正しく動いたことの検証。
  # 何らかの理由で main への反映が落ちると、ここが赤くなって気づける。
  version-check:
    name: Version not behind latest release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ver_* タグの取得に必要

      - name: Compare package.json version with latest release tag
        shell: bash
        run: |
          # +N は再ビルド番号で package.json には入らないため比較前に落とす
          LATEST="$(git tag -l 'Ver_*' | sed 's/^Ver_//; s/+.*//' | sort -V | tail -1)"
          CURRENT="$(node -p "require('./package.json').version")"

          if [ -z "$LATEST" ]; then
            echo "リリースタグがまだありません (current: $CURRENT)"
            exit 0
          fi

          # sort -V で新しい方が後ろに来る。同値なら CURRENT が返るので合格。
          if [ "$(printf '%s\n%s\n' "$LATEST" "$CURRENT" | sort -V | tail -1)" != "$CURRENT" ]; then
            echo "::error::package.json の version ($CURRENT) が最新リリース Ver_$LATEST より古いままです。Export VSIX の main 同期が失敗した可能性があります"
            exit 1
          fi
          echo "OK: package.json $CURRENT >= 最新リリース $LATEST"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run security scan with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  package-check:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: [lint-and-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run compile

      - name: Package VSIX
        run: npm run package

      # CHANGELOG のパースが壊れると、気づくのがリリース当日になる。
      # 本文が空でもフォールバックが効くので、見出しが出ることだけ確かめる。
      - name: Smoke-test release notes generation
        run: bash scripts/gen-release-notes.sh 9.9.9 --stdout | grep -q "## What's Changed"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: vsix/*.vsix
          retention-days: 7

